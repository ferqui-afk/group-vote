<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votar 🗳️</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="top">
  <h1 id="roomTitle">🗳️ Votación</h1>
  <p><span class="status open" id="roomStatus">…</span> <span id="voteCount" class="hint"></span></p>
</header>
<main>
  <div id="winnerBox" class="hidden"></div>
  <div id="candidates"></div>
  <div class="card center hidden" id="orgCard">
    <p class="hint">Eres el organizador de esta votación.</p>
    <button class="btn-ghost" id="closeBtn">Cerrar votación y ver ganador</button>
  </div>
  <p class="hint center" id="expiryHint"></p>
</main>
<script src="/js/vote.js"></script>
</body>
</html>
