<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votar 🗳️</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header class="top">
  <h1 id="roomTitle">🗳️ Votación</h1>
  <p><span class="status open" id="roomStatus">…</span> <span id="voteCount" class="hint"></span></p>
  <p style="margin:6px 0 0"><a href="/" class="btn-ghost btn-small" style="text-decoration:none">← Mis votaciones</a></p>
</header>
<main class="vote-main">
  <div id="winnerBox" class="hidden"></div>
  <div class="view-toggle">
    <button class="btn-ghost btn-small" id="viewCards">🗺️ Lugares</button>
    <button class="btn-ghost btn-small" id="viewBoard">📊 Tablero</button>
  </div>
  <div id="voteMap"></div>
  <div id="boardView" class="hidden"></div>
  <div id="nameBox" class="card center hidden">
    <p class="hint" style="margin:0 0 8px">✏️ Escribe tu nombre para votar:</p>
    <input id="nameInput" maxlength="40" placeholder="Tu nombre" autocomplete="name">
  </div>
  <div id="carousel" class="carousel"></div>
  <div class="dots" id="dots"></div>
  <div class="card center hidden" id="orgCard">
    <p class="hint">Eres el organizador de esta votación.</p>
    <button class="btn-ghost" id="closeBtn">Cerrar votación y ver ganador</button>
  </div>
  <p class="hint center" id="expiryHint"></p>
  <p class="center"><a href="/" class="btn-ghost btn-small" style="text-decoration:none">← Volver a Mis votaciones</a></p>
</main>
<script src="/js/vote.js"></script>
</body>
</html>
