<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votar 🗳️</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header class="top">
  <h1 id="roomTitle">🗳️ Votación</h1>
  <div class="prefs"><button id="themeBtn" aria-label="Cambiar tema">🌙</button><button id="langBtn" aria-label="Cambiar idioma">EN</button></div>
  <p class="sub"><span class="status open" id="roomStatus">…</span> <span id="voteCount" class="hint"></span> · <a href="/" data-i18n="dash_title">← Mis votaciones</a></p>
</header>
<main class="vote-main">
  <div id="winnerBox" class="hidden"></div>
  <div class="view-toggle">
    <button class="btn-ghost btn-small" id="viewCards" data-i18n="view_places">🗺️ Lugares</button>
    <button class="btn-ghost btn-small" id="viewBoard" data-i18n="view_board_short">📊 Tablero</button>
  </div>
  <div id="voteMap"></div>
  <div id="boardView" class="hidden"></div>
  <div id="nameBox" class="card center hidden">
    <p class="hint" style="margin:0 0 8px" data-i18n="name_prompt">✏️ Escribe tu nombre para votar:</p>
    <input id="nameInput" maxlength="40" placeholder="Tu nombre" data-i18n-ph="name_ph" autocomplete="name">
  </div>
  <details class="card" id="qrCard">
    <summary style="cursor:pointer"><strong data-i18n="qr_title">📱 QR para invitar</strong> <span class="hint" data-i18n="qr_sub">— que entren más a votar</span></summary>
    <div class="qr-wrap center">
      <img id="qrImgVote" alt="QR de la votación" style="margin-top:8px">
      <p><button class="btn-ghost btn-small" id="copyVoteLink" data-i18n="copy_link">Copiar enlace</button></p>
    </div>
  </details>
  <div id="carousel" class="carousel"></div>
  <div class="dots" id="dots"></div>
  <div class="card center hidden" id="orgCard">
    <p class="hint" data-i18n="org_hint">Eres el organizador de esta votación.</p>
    <button class="btn-ghost" id="closeBtn">Cerrar votación y ver ganador</button>
    <div id="editPlaces" class="hidden" style="margin-top:12px;border-top:1px solid #ddd;padding-top:12px">
      <p class="hint" style="margin:0 0 8px" data-i18n="edit_places">✏️ Editar lugares</p>
      <input id="addPlaceInput" maxlength="80" placeholder="Buscar lugar para añadir…" data-i18n-ph="add_place_ph" autocomplete="off">
      <div id="addPlaceResults" style="margin-top:8px"></div>
    </div>
  </div>
  <p class="hint center" id="expiryHint"></p>
  <p class="center"><a href="/" class="btn-ghost btn-small" style="text-decoration:none" data-i18n="back_dash">← Volver a Mis votaciones</a></p>
</main>
<script src="/js/prefs.js"></script>
<script src="/js/vote.js"></script>
</body>
</html>
